name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild -project NetCheckApp.xcodeproj \
            -scheme NetCheckApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Pack IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/NetCheckApp.app Payload/
          zip -r NetCheckApp.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetCheckApp-IPA
          path: NetCheckApp.ipa

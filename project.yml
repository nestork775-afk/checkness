name: NetCheckApp
options:
  bundleIdPrefix: com.nestor
targets:
  NetCheckApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - ContentView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.whatsapp.WhatsApp.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
